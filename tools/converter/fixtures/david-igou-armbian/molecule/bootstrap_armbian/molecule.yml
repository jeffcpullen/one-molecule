---
platforms:
  - name: instance
    groups:
      - molecule
    mp_backend: '{{ lookup(''env'', ''PROVISIONER'') | default(''qemu'', true) }}'
    mp_defaults:
      qemu:
        cpus: 2
        memory: 2048
        ssh_user: cloud-user
        cpu_model: Nehalem
    mp:
      qemu:
        image: https://dl.armbian.com/uefi-x86/Trixie_cloud_minimal-qcow2
        firmware: uefi
verifier:
  name: ansible
dependency:
  name: galaxy
  enabled: true
  options:
    requirements-file: extensions/molecule/requirements-test.yml
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
