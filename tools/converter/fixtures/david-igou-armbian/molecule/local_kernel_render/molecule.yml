---
provisioner:
  playbooks:
    create: david_igou.molecule_provisioners.create
    destroy: david_igou.molecule_provisioners.destroy
    prepare: david_igou.armbian.molecule_shared_prepare
    converge: david_igou.armbian.molecule_local_kernel_render_converge
    verify: david_igou.armbian.molecule_local_kernel_render_verify
verifier:
  name: ansible
dependency:
  name: galaxy
  enabled: true
  options:
    requirements-file: extensions/molecule/requirements-test.yml
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
