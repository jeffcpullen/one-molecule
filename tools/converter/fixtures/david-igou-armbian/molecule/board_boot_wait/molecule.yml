---
platforms:
  - name: board_boot_wait-ubuntu-2404-podman
    vars:
      mp_backend: '{{ lookup(''env'', ''PROVISIONER'') | default(''podman'', true) }}'
      mp_defaults:
        podman:
          command: sleep 1d
          privileged: false
      mp:
        podman:
          image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
verifier:
  name: ansible
dependency:
  name: galaxy
  enabled: true
  options:
    requirements-file: extensions/molecule/requirements-test.yml
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
