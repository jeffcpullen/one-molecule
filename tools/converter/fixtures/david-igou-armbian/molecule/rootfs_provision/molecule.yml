---
provisioner:
  inventory:
    host_vars:
      instance:
        armbian_nfs_rootfs_path: /var/lib/armbian/test-nfs
        armbian_image_cache: /var/lib/armbian/test-cache
verifier:
  name: ansible
dependency:
  name: galaxy
  enabled: true
  options:
    requirements-file: extensions/molecule/requirements-test.yml
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
