---
platforms:
  - name: image_build-armbian-builder-qemu
    vars:
      mp_backend: '{{ lookup(''env'', ''PROVISIONER'') | default(''qemu'', true) }}'
      mp_defaults:
        qemu:
          cpus: 8
          memory: 16384
          ssh_user: debian
      mp:
        qemu:
          image: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
          disk_size: 100G
provisioner:
  inventory:
    group_vars:
      molecule:
        scenario_userpatches:
          - dest: config/boards/orangepi5pro.conf
            content: |
              function pre_config_uboot_target__orangepi5pro_pxe_first() {
                  declare -a t=("pxe" "dhcp" "mmc1" "mmc0" "nvme" "scsi" "usb" "spi")
                  sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${t[*]}\"/" \
                      include/configs/rockchip-common.h
              }
verifier:
  name: ansible
dependency:
  name: galaxy
  enabled: true
  options:
    requirements-file: extensions/molecule/requirements-test.yml
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
