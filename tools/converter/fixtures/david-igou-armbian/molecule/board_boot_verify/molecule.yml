---
platforms:
  - name: board_boot_verify-debian-13-qemu
    vars:
      mp_backend: '{{ lookup(''env'', ''PROVISIONER'') | default(''qemu'', true) }}'
      mp_defaults:
        qemu:
          cpus: 2
          memory: 2048
          ssh_user: debian
      mp:
        qemu:
          image: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
          disk_size: 4G
verifier:
  name: ansible
dependency:
  name: galaxy
  enabled: true
  options:
    requirements-file: extensions/molecule/requirements-test.yml
ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
