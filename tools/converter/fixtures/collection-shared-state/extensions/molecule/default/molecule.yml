---
driver:
  name: default
platforms:
  - name: default-instance
    image: quay.io/fedora/fedora-toolbox:42
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_connection: containers.podman.podman
  playbooks:
    converge: ${MOLECULE_PROJECT_DIRECTORY}/playbooks/molecule/converge.yml
    create: ${MOLECULE_PROJECT_DIRECTORY}/playbooks/molecule/create-default.yml
    destroy: ${MOLECULE_PROJECT_DIRECTORY}/playbooks/molecule/destroy.yml
    verify: ${MOLECULE_PROJECT_DIRECTORY}/playbooks/molecule/verify-default.yml
scenario:
  test_sequence:
    - create
    - verify
    - destroy
