---
driver:
  name: docker
platforms:
  - name: instance
    image: rndmh3ro/docker-${MOLECULE_DISTRO}-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroupns_mode: host
    pre_build_image: true
provisioner:
  name: ansible
  options:
    diff: true
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks, timer
  playbooks:
    converge: devsec.hardening.molecule_nginx_hardening_converge
    verify: devsec.hardening.molecule_nginx_hardening_verify
    prepare: devsec.hardening.molecule_nginx_hardening_prepare
verifier:
  name: ansible
dependency:
  name: galaxy
  options:
    role-file: molecule/nginx_hardening/requirements.yml
scenario:
  create_sequence:
    - dependency
    - create
    - prepare
  check_sequence:
    - dependency
    - verify molecule/shared/prerequisites.yml
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - dependency
    - create
    - prepare
    - converge
  destroy_sequence:
    - destroy
  test_sequence:
    - dependency
    - verify molecule/shared/prerequisites.yml
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy
