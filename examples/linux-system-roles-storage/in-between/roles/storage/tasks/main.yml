# Copyright (c) 2018 Red Hat, Inc.
# Changed by the one-molecule project from upstream tasks/main.yml: the two set_fact tasks that emptied
# _storage_pools_list and _storage_volumes_list for testing are removed, the test helper
# run_role_with_clear_facts.yml resets them instead, and module names are fully qualified.
- name: Set platform/version specific variables
  ansible.builtin.include_tasks: tasks/set_vars.yml

- name: Validate role parameters
  ansible.builtin.include_tasks: assert_role_vars.yml

- name: Include the appropriate provider tasks
  ansible.builtin.include_tasks: "main-{{ storage_provider }}.yml"

- name: Record role success fingerprint
  sr_fingerprint:
    status: success
    role_name: storage
    role_path: "{{ role_path }}"
    ansible_play_hosts_all: "{{ ansible_play_hosts_all }}"
    distribution: "{{ ansible_facts['distribution'] }}"
    distribution_version: "{{ ansible_facts['distribution_version'] }}"
    write_log_file: "{{ __storage_write_log_file }}"
