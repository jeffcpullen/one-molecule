---
# Molecule destroy: remove the objects create made. The domain is stopped and
# undefined only if libvirt knows it, so a missing domain is not an error and a
# real libvirt failure still fails the task. Its work dir holds the overlay, the
# scenario's data disks, the seed and the SSH keypair, so removing it removes them
# all.
- name: Destroy
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/hypervisor.yml
  tasks:
    - name: List the domains libvirt knows
      community.libvirt.virt:
        command: list_vms
        uri: "{{ libvirt_uri }}"
      register: known_domains

    - name: Stop and undefine the domain
      when: domain in known_domains.list_vms
      block:
        - name: Stop the domain
          community.libvirt.virt:
            name: "{{ domain }}"
            state: destroyed
            uri: "{{ libvirt_uri }}"

        - name: Undefine the domain
          community.libvirt.virt:
            name: "{{ domain }}"
            command: undefine
            uri: "{{ libvirt_uri }}"

    - name: Remove the work dir
      ansible.builtin.file:
        path: "{{ workdir }}"
        state: absent

    - name: Truncate the instance config
      ansible.builtin.copy:
        dest: "{{ molecule_instance_config }}"
        content: "{{ [] | to_nice_yaml }}"
        mode: "0600"
