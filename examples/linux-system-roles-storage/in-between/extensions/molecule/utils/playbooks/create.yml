---
# Molecule create: make the objects converge acts on. Faithful translation of
# standard-inventory-qcow2's disk logic (tox-lsr) into a libvirt domain that is
# defined per scenario and undefined again by destroy.yml. The scenario's data
# disks, the first storage_test_disk_count of utils/vars/disks.yml, are raw sparse
# files, and templates/domain.xml.j2 attaches each one on the virtio-scsi
# controller with its label as the disk serial.
- name: Create
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/disks.yml
    - ../vars/hypervisor.yml
  tasks:
    - name: Check there is exactly one platform to create
      ansible.builtin.assert:
        that:
          - groups['all'] | length == 1
        fail_msg: "This create playbook makes one node, the platforms list has {{ groups['all'] | length }}"

    - name: Check the scenario asks for no more data disks than disks.yml declares
      ansible.builtin.assert:
        that:
          - (hostvars[instance]['storage_test_disk_count'] | int) >= 0
          - (hostvars[instance]['storage_test_disk_count'] | int) <= test_disks | length
        fail_msg: "storage_test_disk_count is {{ hostvars[instance]['storage_test_disk_count'] }},
          utils/vars/disks.yml declares {{ test_disks | length }} data disks"

    - name: Check every data disk carries a label the tests' disk lookup selects
      # The label becomes the disk's serial, and a serial is kept to at most 20
      # characters, the virtio-blk limit, so a label survives a port to that bus.
      ansible.builtin.assert:
        that:
          - (item.label | default('')) is match(hostvars[instance]['storage_test_disk_label'])
          - (item.label | default('')) is match(data_disk_label_prefix)
          - item.label | length <= 20
        fail_msg: "disk {{ idx }}: label {{ item.label | default('unset') }} must start
          {{ hostvars[instance]['storage_test_disk_label'] }} and be at most 20 characters"
      loop: "{{ test_disks }}"
      loop_control:
        index_var: idx

    - name: Check no two data disks share a label
      ansible.builtin.assert:
        that:
          - test_disks | map(attribute='label') | unique | length == test_disks | length

    - name: Make the per-domain work dir
      ansible.builtin.file:
        path: "{{ workdir }}"
        state: directory
        mode: "0755"

    - name: Generate an SSH keypair for this domain
      community.crypto.openssh_keypair:
        path: "{{ ssh_key }}"
        type: ed25519
      register: keypair

    - name: Create a qcow2 overlay so the base image stays clean
      ansible.builtin.command:
        cmd: >-
          qemu-img create -f qcow2 -F qcow2
          -b {{ base_image }} {{ workdir }}/root.qcow2
        creates: "{{ workdir }}/root.qcow2"

    - name: Create each of the scenario's data disks as a sparse raw image
      # standard-inventory-qcow2: NamedTemporaryFile().truncate(size), format=raw
      ansible.builtin.command:
        cmd: "truncate --size={{ item.size }} {{ workdir }}/disk{{ idx }}.raw"
        creates: "{{ workdir }}/disk{{ idx }}.raw"
      loop: "{{ scenario_disks }}"
      loop_control:
        index_var: idx

    - name: Render cloud-init user-data and meta-data
      ansible.builtin.copy:
        dest: "{{ workdir }}/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: user-data
          content: "{{ lookup('template', 'templates/user-data.j2') }}"
        - name: meta-data
          content: "instance-id: {{ domain }}\nlocal-hostname: {{ instance }}\n"

    - name: Build the NoCloud seed ISO
      ansible.builtin.command:
        cmd: >-
          cloud-localds {{ workdir }}/seed.iso
          {{ workdir }}/user-data {{ workdir }}/meta-data
        creates: "{{ workdir }}/seed.iso"

    - name: Define the domain
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('template', 'templates/domain.xml.j2') }}"
        uri: "{{ libvirt_uri }}"

    - name: Start the domain
      community.libvirt.virt:
        name: "{{ domain }}"
        state: running
        uri: "{{ libvirt_uri }}"

    - name: Wait for the lease to hand out an address
      ansible.builtin.command:
        cmd: "virsh --connect {{ libvirt_uri }} -q domifaddr {{ domain }}"
      register: domifaddr
      until: domifaddr.stdout is search('(\\d{1,3}\\.){3}\\d{1,3}')
      retries: 60
      delay: 5
      changed_when: false

    - name: Extract the IPv4 address
      ansible.builtin.set_fact:
        instance_ip: "{{ domifaddr.stdout | regex_search('((\\d{1,3}\\.){3}\\d{1,3})') }}"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ instance_ip }}"
        port: 22
        timeout: 300

    - name: Register the instance for converge and destroy
      ansible.builtin.copy:
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
        content: "{{ [instance_conf] | to_nice_yaml }}"
      vars:
        instance_conf:
          instance: "{{ instance }}"
          address: "{{ instance_ip }}"
          user: "{{ instance_user }}"
          port: 22
          identity_file: "{{ ssh_key }}"
