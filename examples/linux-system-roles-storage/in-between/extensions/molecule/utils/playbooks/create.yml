---
# Molecule create: make the objects converge acts on. Faithful translation of
# standard-inventory-qcow2's disk logic (tox-lsr) into a transient libvirt domain.
# The nine data disks are raw sparse files attached exactly as the qcow2
# provisioner attaches them: virtio by if=virtio, scsi via a virtio-scsi
# controller, nvme via a -device nvme passthrough.
- name: Create
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/disks.yml
  vars:
    instance: "{{ lookup('env', 'MOLECULE_SCENARIO_NAME') | default('default', true) }}-storage"
    workdir: "{{ molecule_ephemeral_directory }}/{{ instance }}"
    # Base cloud image (clean, never written to). Override for your distro/arch.
    base_image: "{{ lookup('env', 'MOLECULE_BASE_IMAGE') |
      default('/var/lib/libvirt/images/fedora-cloud-base.qcow2', true) }}"
    ssh_key: "{{ molecule_ephemeral_directory }}/ssh_key"
  tasks:
    - name: Make the per-instance work dir
      ansible.builtin.file:
        path: "{{ workdir }}"
        state: directory
        mode: "0755"

    - name: Generate an ephemeral SSH keypair
      community.crypto.openssh_keypair:
        path: "{{ ssh_key }}"
        type: ed25519
      register: keypair

    - name: Create a qcow2 overlay so the base image stays clean
      ansible.builtin.command:
        cmd: >-
          qemu-img create -f qcow2 -F qcow2
          -b {{ base_image }} {{ workdir }}/root.qcow2
        creates: "{{ workdir }}/root.qcow2"

    - name: Create each data disk as a sparse raw image
      # standard-inventory-qcow2: NamedTemporaryFile().truncate(size), format=raw
      ansible.builtin.command:
        cmd: "truncate --size={{ item.size }} {{ workdir }}/disk{{ idx }}.raw"
        creates: "{{ workdir }}/disk{{ idx }}.raw"
      loop: "{{ qemu_drives }}"
      loop_control:
        index_var: idx

    - name: Render cloud-init user-data and meta-data
      ansible.builtin.copy:
        dest: "{{ workdir }}/{{ item.name }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: user-data
          content: "{{ lookup('template', 'templates/user-data.j2') }}"
        - name: meta-data
          content: "instance-id: {{ instance }}\nlocal-hostname: {{ instance }}\n"

    - name: Build the NoCloud seed ISO
      ansible.builtin.command:
        cmd: >-
          cloud-localds {{ workdir }}/seed.iso
          {{ workdir }}/user-data {{ workdir }}/meta-data
        creates: "{{ workdir }}/seed.iso"

    - name: Define the domain
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('template', 'templates/domain.xml.j2') }}"

    - name: Start the domain
      community.libvirt.virt:
        name: "{{ instance }}"
        state: running

    - name: Wait for the lease to hand out an address
      ansible.builtin.command:
        cmd: "virsh -q domifaddr {{ instance }}"
      register: domifaddr
      until: domifaddr.stdout | regex_search('(\\d{1,3}\\.){3}\\d{1,3}')
      retries: 60
      delay: 5
      changed_when: false

    - name: Extract the IPv4 address
      ansible.builtin.set_fact:
        instance_ip: "{{ domifaddr.stdout | regex_search('((\\d{1,3}\\.){3}\\d{1,3})') }}"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ instance_ip }}"
        port: 22
        timeout: 300

    - name: Register the instance for converge and destroy
      ansible.builtin.copy:
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
        content: "{{ [instance_conf] | to_nice_yaml }}"
      vars:
        instance_conf:
          instance: "{{ instance }}"
          address: "{{ instance_ip }}"
          user: "cloud-user"          # match the base image's default user
          port: 22
          identity_file: "{{ ssh_key }}"
