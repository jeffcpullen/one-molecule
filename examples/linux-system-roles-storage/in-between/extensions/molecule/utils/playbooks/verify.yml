---
# Molecule verify: check the disk objects create made reached the node. The
# role's own assertions run inside each converge playbook, as they do upstream,
# so this checks the fixture they rely on: every label in the scenario's slice of
# utils/vars/disks.yml (scenario_disks) is on exactly one disk of the declared
# size, and no other disk carries a data disk label. A scenario with no data
# disks passes only when the node has none. Disks are found by label alone, never by driver,
# bus or device name, so these checks hold whatever hypervisor attached them,
# as long as it reproduces the labels.
- name: Verify the data disks
  hosts: all
  gather_facts: false
  vars_files:
    - ../vars/disks.yml
  tasks:
    - name: List the whole disks on the node
      ansible.builtin.command:
        cmd: lsblk --json --bytes --nodeps --output NAME,TYPE,SIZE,SERIAL
      register: lsblk
      changed_when: false

    - name: Keep the disks carrying a data disk label
      ansible.builtin.set_fact:
        found_disks: "{{ (lsblk.stdout | from_json).blockdevices | selectattr('type', 'eq', 'disk') |
          selectattr('serial', 'string') | selectattr('serial', 'match', data_disk_label_prefix) | list }}"

    - name: Check every declared label is on exactly one disk of the declared size, to the 512-byte sector
      # qemu rounds a raw image that is not a whole number of sectors up to the
      # next one, so 1099511627800 bytes shows as 1099511628288.
      ansible.builtin.assert:
        that:
          - matches | length == 1
          - ((item.size | int) - (matches[0].size | default(0) | int)) | abs < 512
        fail_msg: "{{ item.label }}: declared {{ item.size }} bytes, found {{ matches }}"
      vars:
        matches: "{{ found_disks | selectattr('serial', 'eq', item.label) | list }}"
      loop: "{{ scenario_disks }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Check no disk carries a data disk label that was not declared
      ansible.builtin.assert:
        that:
          - (found_disks | map(attribute='serial') | sort) == (scenario_disks | map(attribute='label') | sort)
        fail_msg: "found labels {{ found_disks | map(attribute='serial') | sort }}"
