---
# The node and disk objects the storage tests act on, translated from
# before/tests/provision.fmf (standard-inventory-qcow2 -> qemu). One shared file,
# because provision.fmf sits at the tests root and every scenario gets the same node.
# Nothing here names a hypervisor. templates/domain.xml.j2 is the only place a
# disk meets a libvirt bus, so a port to another hypervisor replaces that template
# and keeps this file.

# The node's memory, provision.fmf qemu.m.
node_memory_mb: 2048

# Every data disk carries a label, a serial the guest reads back from lsblk SERIAL
# and /dev/disk/by-id. The label is the only way anything in this tree finds a
# data disk: the tests' disk lookup and verify.yml both select on it, never on a
# driver, a bus or a device name. Only data disks carry a label starting with
# this prefix.
data_disk_label_prefix: om-

# The data disks, one ordered list of the three scsi disks in provision.fmf, in
# its order. These are the disks upstream's base and _scsi playbooks take,
# because find_unused_disk sorts and they come first. provision.fmf's three
# virtio and three nvme disks are not translated. size is in bytes and copied
# byte-for-byte from provision.fmf. label is the disk's serial, at most 20
# characters, and is not in provision.fmf.
test_disks:
  - size: 1099511627800      # 1 TiB plus 24 bytes
    label: om-scsi-0
  - size: 1099511627800
    label: om-scsi-1
  - size: 10737418240        # 10 GiB
    label: om-scsi-2

# The disks a scenario gets: the first storage_test_disk_count of test_disks. The
# count is an inventory var (default in ../../config.yml, overridden in a
# scenario's molecule.yml), read from the one platform's hostvars so create.yml,
# which runs on localhost, and verify.yml, which runs on the node, see the same
# slice. A scenario that needs no data disk gets none.
scenario_disks: "{{ test_disks[:(hostvars[groups['all'][0]]['storage_test_disk_count'] | int)] }}"
