# Converted by the one-molecule project from the upstream per-scenario Molecule layout to the single top-level layout.
defaults:
  ansible:
    executor:
      backend: ansible-playbook
      args:
        ansible_playbook:
          - --inventory=inventory/
    env:
      ANSIBLE_FORCE_COLOR: true
    cfg:
      defaults:
        gathering: explicit
  scenario:
    converge_sequence:
      - syntax
      - converge
      - verify
    test_sequence:
      - syntax
      - create
      - converge
      - idempotence
      - verify
    cleanup_sequence:
      - destroy
  dependency:
    name: galaxy
    enabled: false
  verifier:
    name: ansible

scenarios:
  - name: ansible_only
    playbooks:
      converge: arista.avd.molecule_ansible_only_converge
      verify: arista.avd.molecule_ansible_only_verify
