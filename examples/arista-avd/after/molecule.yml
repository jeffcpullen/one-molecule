    scenario:
      converge_sequence:
        - converge
      test_sequence:
        - create
        - converge
        - idempotence
      cleanup_sequence:
        - destroy
    playbooks:
      converge: arista.avd.molecule_anta_runner_converge
  - name: cv_deploy
