          ansible_playbook:
            - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../../../examples/single-dc-l3ls/inventory.yml
    scenario:
      converge_sequence:
        - dependency
        - create
        - prepare
        - converge
      test_sequence:
