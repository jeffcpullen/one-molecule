      executor:
        args:
          ansible_playbook:
            - --inventory=inventory/hosts.yml
      env:
        PYTHONPATH: ${PYTHONPATH}:${MOLECULE_SCENARIO_DIRECTORY}/custom_modules
    scenario:
      converge_sequence:
        - syntax
        - converge
        - verify
        - side_effect
      test_sequence:
        - syntax
        - create
        - converge
        - idempotence
        - verify
        - side_effect
