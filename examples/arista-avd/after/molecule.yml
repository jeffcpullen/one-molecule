    scenario:
      converge_sequence:
        - dependency
        - create
        - prepare
        - converge
      test_sequence:
        - converge
        - idempotence
    playbooks:
      converge: ${MOLECULE_SCENARIO_DIRECTORY}/../../../examples/single-dc-l3ls-ipv6/build.yml
  - name: example-single-dc-multipod-l3ls
    ansible:
      executor:
        args:
          ansible_playbook:
            - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../../../examples/single-dc-multipod-l3ls/inventory.yml
