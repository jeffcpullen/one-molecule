# Converted by the one-molecule project from the upstream per-scenario Molecule layout to the single top-level layout.
defaults:
  ansible:
    executor:
      backend: ansible-playbook
      args:
        ansible_playbook:
          - --inventory=inventory/
    env:
      ANSIBLE_FORCE_COLOR: true
    cfg:
      defaults:
        gathering: explicit
  scenario:
    converge_sequence:
      - syntax
      - converge
      - verify
    test_sequence:
      - syntax
      - create
      - converge
      - idempotence
      - verify
    cleanup_sequence:
      - destroy
  dependency:
    name: galaxy
    enabled: false
  verifier:
    name: ansible

scenarios:
  - name: ansible_only
  - name: anta_runner
    scenario:
      converge_sequence:
        - converge
      test_sequence:
        - create
        - converge
        - idempotence
  - name: cv_deploy
    scenario:
      converge_sequence:
        - syntax
        - converge
      test_sequence:
        - syntax
        - converge
        - cleanup
  - name: cv_deploy_manifest
    ansible:
      executor:
        args:
          ansible_playbook:
            - --inventory=../cv_deploy/inventory/
    scenario:
      converge_sequence:
        - syntax
        - converge
      test_sequence:
        - syntax
        - converge
        - cleanup
  - name: cv_deploy_negative_tests
    ansible:
      executor:
        args:
          ansible_playbook:
            - --inventory=../cv_deploy/inventory/
    scenario:
      converge_sequence:
        - syntax
        - converge
      test_sequence:
        - syntax
        - converge
        - cleanup
  - name: cv_workflow
    scenario:
      converge_sequence:
        - syntax
        - converge
      test_sequence:
        - syntax
        - create
        - converge
        - verify
        - cleanup
  - name: default
  - name: digital_twin
  - name: eos_cli_config_gen
    scenario:
      converge_sequence:
        - syntax
        - converge
      test_sequence:
        - syntax
        - create
        - converge
        - idempotence
  - name: eos_cli_config_gen_deprecated_vars
    scenario:
      converge_sequence:
        - syntax
        - converge
      test_sequence:
        - syntax
        - create
        - converge
        - idempotence
  - name: eos_cli_config_gen_negative_unit_tests
    scenario:
      converge_sequence:
        - syntax
        - converge
      test_sequence:
        - syntax
        - create
        - converge
        - idempotence
  - name: eos_designs-l2ls
  - name: eos_designs-mpls-isis-sr-ldp
  - name: eos_designs-twodc-5stage-clos
  - name: eos_designs_deprecated_vars
  - name: eos_designs_negative_unit_tests
  - name: eos_designs_unit_tests
    ansible:
      env:
        PYTHONPATH: ${PYTHONPATH}:${MOLECULE_SCENARIO_DIRECTORY}/custom_modules
  - name: evpn_underlay_ebgp_overlay_ebgp
  - name: evpn_underlay_isis_overlay_ibgp
  - name: evpn_underlay_ospf_overlay_ebgp
  - name: evpn_underlay_rfc5549_overlay_ebgp
  - name: example-campus-fabric
    ansible:
      executor:
        args:
          ansible_playbook:
            - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../../../examples/campus-fabric/inventory.yml
    scenario:
      converge_sequence:
        - converge
      test_sequence:
        - converge
        - idempotence
    playbooks:
      converge: ${MOLECULE_SCENARIO_DIRECTORY}/../../../examples/campus-fabric/build.yml
  - name: example-cv-pathfinder
    ansible:
      executor:
        args:
          ansible_playbook:
            - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/../../../examples/cv-pathfinder/inventory.yml
      cfg:
        defaults:
          vault_password_file: ${MOLECULE_SCENARIO_DIRECTORY}/../../../examples/cv-pathfinder/.vault
    scenario:
      converge_sequence:
