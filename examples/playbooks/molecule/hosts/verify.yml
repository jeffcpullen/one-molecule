---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the hosts file
      ansible.builtin.slurp:
        src: "{{ hosts_path }}"
      register: hosts_file

    - name: Check the app host line
      ansible.builtin.assert:
        that:
          - "'10.0.0.10 app.example.internal' in (hosts_file.content | b64decode)"
