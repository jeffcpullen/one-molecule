---
# SPDX-License-Identifier: Apache-2.0
platforms:
  - name: instance

defaults:
  driver:
    name: default
    options:
      managed: false
  provisioner:
    name: ansible
    inventory:
      group_vars:
        all:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
  verifier:
    name: ansible
  scenario:
    test_sequence:
      - syntax
      - converge
      - idempotence
      - verify

scenarios:
  - name: motd
    provisioner:
      inventory:
        group_vars:
          all:
            motd_path: "{{ molecule_ephemeral_directory }}/motd"
  - name: hosts
    provisioner:
      inventory:
        group_vars:
          all:
            hosts_path: "{{ molecule_ephemeral_directory }}/hosts"
