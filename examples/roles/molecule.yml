---
# SPDX-License-Identifier: Apache-2.0
platforms:
  - name: instance

defaults:
  driver:
    name: default
    options:
      managed: false
  playbooks:
    converge: ../../playbooks/molecule/converge.yml
  provisioner:
    name: ansible
    env:
      ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    inventory:
      group_vars:
        all:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
  verifier:
    name: ansible
  scenario:
    test_sequence:
      - syntax
      - converge
      - idempotence
      - verify

scenarios:
  - name: motd
    provisioner:
      inventory:
        group_vars:
          all:
            role_under_test: motd
            motd_path: "{{ molecule_ephemeral_directory }}/motd"
  - name: issue
    provisioner:
      inventory:
        group_vars:
          all:
            role_under_test: issue
            issue_path: "{{ molecule_ephemeral_directory }}/issue"
  - name: profile
    provisioner:
      inventory:
        group_vars:
          all:
            role_under_test: profile
            profile_path: "{{ molecule_ephemeral_directory }}/editor.sh"
