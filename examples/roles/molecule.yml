---
# SPDX-License-Identifier: Apache-2.0
platforms:
  - name: instance
    image: quay.io/fedora/fedora-toolbox:42

defaults:
  driver:
    name: default
  playbooks:
    converge: ../../playbooks/molecule/converge.yml
    create: ../../playbooks/molecule/create.yml
    destroy: ../../playbooks/molecule/destroy.yml
  provisioner:
    name: ansible
    env:
      ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    inventory:
      group_vars:
        all:
          ansible_connection: containers.podman.podman
  verifier:
    name: ansible

scenarios:
  - name: motd
    playbooks:
      verify: ../../playbooks/molecule/verify-motd.yml
  - name: issue
    playbooks:
      verify: ../../playbooks/molecule/verify-issue.yml
  - name: profile
    playbooks:
      verify: ../../playbooks/molecule/verify-profile.yml
