---
# SPDX-License-Identifier: Apache-2.0
# Converted by the one-molecule project from the upstream per-scenario Molecule layout to the single top-level layout.
defaults:
  driver:
    name: docker
  platforms:
    - name: instance
      image: rndmh3ro/docker-${MOLECULE_DISTRO}-ansible:latest
      command: ${MOLECULE_DOCKER_COMMAND:-/lib/systemd/systemd}
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
      privileged: true
      cgroupns_mode: host
      pre_build_image: true
  verifier:
    name: ansible
  scenario:
    create_sequence:
      - dependency
      - create
      - prepare
    check_sequence:
      - dependency
      - verify molecule/shared/prerequisites.yml
      - destroy
      - create
      - prepare
      - converge
      - check
      - destroy
    converge_sequence:
      - dependency
      - create
      - prepare
      - converge
    destroy_sequence:
      - destroy
    test_sequence:
      - dependency
      - verify molecule/shared/prerequisites.yml
      - destroy
      - syntax
      - create
      - prepare
      - check
      - converge
      - idempotence
      - verify
      - destroy

scenarios:
  - name: mysql_hardening
    dependency:
      name: galaxy
      options:
        role-file: molecule/mysql_hardening/requirements.yml
        requirements-file: molecule/mysql_hardening/requirements.yml
    provisioner:
      name: ansible
      options:
        diff: true
      config_options:
        defaults:
          interpreter_python: auto_silent
          callbacks_enabled: profile_tasks, timer
    playbooks:
      converge: devsec.hardening.molecule_mysql_hardening_converge
      verify: devsec.hardening.molecule_mysql_hardening_verify
      prepare: devsec.hardening.molecule_mysql_hardening_prepare
  - name: nginx_hardening
    dependency:
      name: galaxy
      options:
        role-file: molecule/nginx_hardening/requirements.yml
    provisioner:
      name: ansible
      options:
        diff: true
      config_options:
        defaults:
          interpreter_python: auto_silent
          callbacks_enabled: profile_tasks, timer
    playbooks:
      converge: devsec.hardening.molecule_nginx_hardening_converge
      verify: devsec.hardening.molecule_nginx_hardening_verify
      prepare: devsec.hardening.molecule_nginx_hardening_prepare
  - name: os_hardening
    provisioner:
      name: ansible
      options:
        diff: true
      config_options:
        defaults:
          interpreter_python: auto_silent
          callbacks_enabled: profile_tasks, timer
          inject_facts_as_vars: false
    playbooks:
      converge: devsec.hardening.molecule_os_hardening_converge
      verify: devsec.hardening.molecule_os_hardening_verify
      prepare: devsec.hardening.molecule_os_hardening_prepare
  - name: os_hardening_vm
    dependency:
      name: galaxy
      options:
        role-file: molecule/os_hardening_vm/requirements.yml
    driver:
      name: vagrant
      provider:
        name: libvirt
    platforms:
      - name: ${USER}
        box: ${MOLECULE_DISTRO}
        memory: 1024
        cpus: 2
    provisioner:
      name: ansible
      options:
        diff: true
      env:
        ANSIBLE_PIPELINING: "True"
      config_options:
        defaults:
          interpreter_python: auto_silent
          callbacks_enabled: profile_tasks, timer
          library: "${MOLECULE_PROJECT_DIRECTORY}/plugins/modules:/usr/share/ansible:${MOLECULE_VAGRANT_PLUGIN_DIR}"
          inject_facts_as_vars: false
    verifier:
      name: ansible
      env:
        ANSIBLE_PIPELINING: "True"
    playbooks:
      converge: devsec.hardening.molecule_os_hardening_vm_converge
      verify: devsec.hardening.molecule_os_hardening_vm_verify
      prepare: devsec.hardening.molecule_os_hardening_vm_prepare
  - name: ssh_hardening
    provisioner:
      name: ansible
      options:
        diff: true
      config_options:
        defaults:
          interpreter_python: auto_silent
          callbacks_enabled: profile_tasks, timer
          inject_facts_as_vars: false
      inventory:
        host_vars:
          instance:
            ansible_user: ansible
    playbooks:
      converge: devsec.hardening.molecule_ssh_hardening_converge
      verify: devsec.hardening.molecule_ssh_hardening_verify
      prepare: devsec.hardening.molecule_ssh_hardening_prepare
  - name: ssh_hardening_custom_tests
    provisioner:
      name: ansible
      options:
        diff: true
      config_options:
        defaults:
          interpreter_python: auto_silent
          callbacks_enabled: profile_tasks, timer
          inject_facts_as_vars: false
    scenario:
      create_sequence:
        - dependency
        - create
        - prepare
      check_sequence:
        - dependency
        - verify molecule/shared/prerequisites.yml
        - destroy
        - create
        - prepare
        - converge
        - check
        - destroy
      converge_sequence:
        - dependency
        - create
        - prepare
        - converge
      destroy_sequence:
        - destroy
      test_sequence:
        - dependency
        - verify molecule/shared/prerequisites.yml
        - destroy
        - syntax
        - create
        - prepare
        - check
        - converge
        - idempotence
        - destroy
    playbooks:
      converge: devsec.hardening.molecule_ssh_hardening_custom_tests_converge
      prepare: devsec.hardening.molecule_ssh_hardening_custom_tests_prepare
  - name: ssh_hardening_vm
    driver:
      name: vagrant
      provider:
        name: libvirt
    platforms:
      - name: ${USER}
        box: ${MOLECULE_DISTRO}
        memory: 1024
        cpus: 2
    provisioner:
      name: ansible
      options:
        diff: true
      env:
        ANSIBLE_PIPELINING: "True"
      config_options:
        defaults:
          interpreter_python: auto_silent
          callbacks_enabled: profile_tasks, timer
          library: "${MOLECULE_PROJECT_DIRECTORY}/plugins/modules:/usr/share/ansible:${MOLECULE_VAGRANT_PLUGIN_DIR}"
          inject_facts_as_vars: false
    verifier:
      name: ansible
      env:
        ANSIBLE_PIPELINING: "True"
    scenario:
      create_sequence:
        - dependency
        - create
        - prepare
      check_sequence:
        - dependency
        - verify molecule/shared/prerequisites.yml
        - destroy
        - create
        - prepare
        - converge
        - check
        - destroy
      converge_sequence:
        - dependency
        - create
        - prepare
        - converge
      destroy_sequence:
        - destroy
      test_sequence:
        - dependency
        - verify molecule/shared/prerequisites.yml
        - destroy
        - syntax
        - create
        - prepare
        - converge
        - idempotence
        - verify
        - destroy
    playbooks:
      converge: devsec.hardening.molecule_ssh_hardening_vm_converge
      verify: devsec.hardening.molecule_ssh_hardening_vm_verify
      prepare: devsec.hardening.molecule_ssh_hardening_vm_prepare
