---
# SPDX-License-Identifier: Apache-2.0
# Converted by the one-molecule project from the upstream per-scenario Molecule layout to the single top-level layout.
defaults:
  driver:
    name: docker
  platforms:
    - name: instance
      image: rndmh3ro/docker-${MOLECULE_DISTRO}-ansible:latest
      command: ${MOLECULE_DOCKER_COMMAND:-/lib/systemd/systemd}
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
      privileged: true
      cgroupns_mode: host
      pre_build_image: true
  provisioner:
    name: ansible
    options:
      diff: true
    config_options:
      defaults:
        interpreter_python: auto_silent
        callbacks_enabled: profile_tasks, timer
  verifier:
    name: ansible
  scenario:
    create_sequence:
      - dependency
      - create
      - prepare
    check_sequence:
      - dependency
      - verify ../shared/prerequisites.yml
      - destroy
      - create
      - prepare
      - converge
      - check
      - destroy
    converge_sequence:
      - dependency
      - create
      - prepare
      - converge
    destroy_sequence:
      - destroy
    test_sequence:
      - dependency
      - verify ../shared/prerequisites.yml
      - destroy
      - syntax
      - create
      - prepare
      - check
      - converge
      - idempotence
      - verify
      - destroy

scenarios:
  - name: mysql_hardening
    dependency:
      name: galaxy
      options:
        role-file: molecule/mysql_hardening/requirements.yml
        requirements-file: molecule/mysql_hardening/requirements.yml
  - name: nginx_hardening
    dependency:
      name: galaxy
      options:
        role-file: molecule/nginx_hardening/requirements.yml
  - name: os_hardening
    provisioner:
      config_options:
        defaults:
          inject_facts_as_vars: false
  - name: os_hardening_vm
    dependency:
      name: galaxy
      options:
        role-file: molecule/os_hardening_vm/requirements.yml
    driver:
      name: vagrant
      provider:
        name: libvirt
    platforms:
      - name: ${USER}
        box: ${MOLECULE_DISTRO}
        memory: 1024
        cpus: 2
    provisioner:
      env:
        ANSIBLE_PIPELINING: "True"
      config_options:
        defaults:
          library: "${MOLECULE_PROJECT_DIRECTORY}/plugins/modules:/usr/share/ansible:${MOLECULE_VAGRANT_PLUGIN_DIR}"
          inject_facts_as_vars: false
    verifier:
      env:
        ANSIBLE_PIPELINING: "True"
  - name: ssh_hardening
    provisioner:
      config_options:
        defaults:
          inject_facts_as_vars: false
      inventory:
        host_vars:
          instance:
            ansible_user: ansible
  - name: ssh_hardening_custom_tests
    provisioner:
      config_options:
        defaults:
          inject_facts_as_vars: false
    scenario:
      test_sequence:
        - dependency
        - verify ../shared/prerequisites.yml
        - destroy
        - syntax
        - create
        - prepare
        - check
        - converge
        - idempotence
        - destroy
  - name: ssh_hardening_vm
    driver:
      name: vagrant
      provider:
        name: libvirt
    platforms:
      - name: ${USER}
        box: ${MOLECULE_DISTRO}
        memory: 1024
        cpus: 2
    provisioner:
      env:
        ANSIBLE_PIPELINING: "True"
      config_options:
        defaults:
          library: "${MOLECULE_PROJECT_DIRECTORY}/plugins/modules:/usr/share/ansible:${MOLECULE_VAGRANT_PLUGIN_DIR}"
          inject_facts_as_vars: false
    verifier:
      env:
        ANSIBLE_PIPELINING: "True"
    scenario:
      test_sequence:
        - dependency
        - verify ../shared/prerequisites.yml
        - destroy
        - syntax
        - create
        - prepare
        - converge
        - idempotence
        - verify
        - destroy
