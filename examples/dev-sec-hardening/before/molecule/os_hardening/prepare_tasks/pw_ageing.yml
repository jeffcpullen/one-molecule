---
- name: Create user those password ageing should not be changed
  user:
    name: pw_no_ageing
    # Changed by the one-molecule project: upstream's literal SHA-512 crypt hash is computed at run time instead.
    password: "{{ 'pw-ageing-placeholder' | password_hash('sha512', 'mysecretsalt') }}"
    password_expire_max: "-1"

- name: Create user those password ageing should be changed
  user:
    name: pw_ageing
    # Changed by the one-molecule project: upstream's literal SHA-512 crypt hash is computed at run time instead.
    password: "{{ 'pw-ageing-placeholder' | password_hash('sha512', 'mysecretsalt') }}"
    password_expire_max: "-1"
