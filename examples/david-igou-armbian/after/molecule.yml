---
# SPDX-License-Identifier: MIT
# Copyright (c) 2026 David Igou
# Converted by the one-molecule project from the upstream per-scenario Molecule layout to the single top-level layout.
platforms:
  - name: debian-13-qemu
    groups:
      - molecule
    mp_backend: "{{ lookup('env', 'PROVISIONER') | default('qemu', true) }}"
    mp_defaults:
      qemu:
        cpus: 2
        memory: 2048
        ssh_user: debian
    mp:
      qemu:
        image: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
        disk_size: 4G
  - name: ubuntu-2404-podman
    groups:
      - molecule
    mp_backend: "{{ lookup('env', 'PROVISIONER') | default('podman', true) }}"
    mp_defaults:
      podman:
        command: sleep 1d
        privileged: false
    mp:
      podman:
        image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
  - name: armbian-builder-qemu
    groups:
      - molecule
    mp_backend: "{{ lookup('env', 'PROVISIONER') | default('qemu', true) }}"
    mp_defaults:
      qemu:
        cpus: 8
        memory: 16384
        ssh_user: debian
    mp:
      qemu:
        image: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
        disk_size: 100G

defaults:
  dependency:
    name: galaxy
    enabled: true
    options:
      requirements-file: extensions/molecule/requirements-test.yml
  ansible:
    executor:
      args:
        ansible_playbook:
          - --inventory=${MOLECULE_EPHEMERAL_DIRECTORY}/inventory/
  scenario:
    test_sequence:
      - dependency
      - syntax
      - create
      - prepare
      - converge
      - verify
      - destroy
  verifier:
    name: ansible

scenarios:
  - name: board_boot_verify
    platforms:
      - debian-13-qemu
  - name: board_boot_wait
    platforms:
      - ubuntu-2404-podman
  - name: bootstrap_armbian
    platforms:
      - name: instance
        groups:
          - molecule
        mp_backend: "{{ lookup('env', 'PROVISIONER') | default('qemu', true) }}"
        mp_defaults:
          qemu:
            cpus: 2
            memory: 2048
            ssh_user: cloud-user
            cpu_model: Nehalem
        mp:
          qemu:
            image: https://dl.armbian.com/uefi-x86/Trixie_cloud_minimal-qcow2
            firmware: uefi
  - name: disk_image
    platforms:
      - debian-13-qemu
  - name: disk_provision
    platforms:
      - debian-13-qemu
  - name: image_build
    platforms:
      - armbian-builder-qemu
    provisioner:
      inventory:
        group_vars:
          molecule:
            scenario_userpatches:
              - dest: config/boards/orangepi5pro.conf
                content: |
                  function pre_config_uboot_target__orangepi5pro_pxe_first() {
                      declare -a t=("pxe" "dhcp" "mmc1" "mmc0" "nvme" "scsi" "usb" "spi")
                      sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${t[*]}\"/" \
                          include/configs/rockchip-common.h
                  }
  - name: local_kernel_render
    platforms:
      - ubuntu-2404-podman
  - name: persist_uboot_env
    platforms:
      - ubuntu-2404-podman
  - name: pxelinux_render
    platforms:
      - name: instance
        groups:
          - molecule
        mp_backend: "{{ lookup('env', 'PROVISIONER') | default('podman', true) }}"
        mp_defaults:
          podman:
            command: sleep 1d
            privileged: false
        mp:
          podman:
            image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
  - name: rootfs_provision
    platforms:
      - debian-13-qemu
    provisioner:
      inventory:
        host_vars:
          rootfs_provision-debian-13-qemu:
            armbian_nfs_rootfs_path: /var/lib/armbian/test-nfs
            armbian_image_cache: /var/lib/armbian/test-cache
