---
# SPDX-License-Identifier: Apache-2.0
# Converted by the one-molecule project from the upstream per-scenario Molecule layout to the single top-level layout.
scenarios:
  - name: default
    scenario:
      test_sequence: []
    platforms: []
    provisioner:
      name: ansible
  - name: delegated
    dependency:
      name: galaxy
      options:
        requirements-file: molecule/delegated/collections.yml
    driver:
      name: default
      options:
        managed: false
        ansible_connection_options:
          ansible_connection: local
    platforms:
      - name: "molecule-${ANSIBLE_ROLE}"
    provisioner:
      name: ansible
      env:
        ANSIBLE_LIBRARY: ../../plugins
        ANSIBLE_ROLES_PATH: ../../roles
        ANSIBLE_COLLECTIONS_PATH: /home/zuul/venv/.ansible/collections:/home/zuul/.ansible/collections
      inventory:
        group_vars:
          all:
            molecule_role: "${ANSIBLE_ROLE}"
            prepared_vars_path: "/tmp/ansible-molecule"
    verifier:
      name: testinfra
      options:
        v: 2
      additional_files_or_dirs:
        - "${ANSIBLE_ROLE}.py"
        - "${ANSIBLE_ROLE}/*.py"
      env:
        ROLE_NAME: "${ANSIBLE_ROLE}"
    scenario:
      test_sequence:
        - dependency
        - create
        - prepare
        - converge
        - verify
        - destroy
    playbooks:
      prepare: osism.commons.molecule_delegated_prepare
      converge: osism.commons.molecule_delegated_converge
