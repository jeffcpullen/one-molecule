---
# SPDX-License-Identifier: Apache-2.0
# Converted by the one-molecule project from the upstream per-scenario Molecule layout to the single top-level layout.
defaults:
  dependency:
    name: galaxy
    options:
      requirements-file: requirements.yml
  provisioner:
    name: ansible
    lint:
      name: ansible-lint
    config_options:
      defaults:
        inject_facts_as_vars: false
  scenario:
    test_sequence:
      - dependency
      - destroy
      - syntax
      - create
      - prepare
      - converge
      - idempotence
      - verify
      - side_effect
      - destroy

scenarios:
  - name: default
    driver:
      name: docker
    platforms:
      - name: "systemd-service-${MOLECULE_SCENARIO_NAME}"
        image: "${DOCKER_REGISTRY:-quay.io/gotmax23}/${DOCKER_IMAGE_TAG:-debian-systemd:trixie}"
        command: ${DOCKER_COMMAND:-""}
        pre_build_image: true
        privileged: true
        groups:
          - service_hosts
    playbooks:
      converge: tests/test.yml
      side_effect: tests/side_effect.yml
      verify: tests/verify.yml
