# yaml-language-server: $schema=../structure/open-questions.schema.yml
---
# Open-questions source: undecided items and the TODO backlog. A decided item moves to its
# owning source and is deleted here.
#
# Each open item keeps bounded framing lines only. Deep argumentation, motivation quotes,
# and inline file.py:line citations stay out of the corpus. No semicolons and no em or
# en dashes.

title: "Open questions"
intro: "Highest-churn file. Move items out to the topic files as they are decided."

open:
  - title: "Spell run args and secrets"
    status: "behavior settled, spelling not started"
    raised: "2026-09-24"
    owning_doc: "`design/data/environment.yml`"
    framing:
      - "The key that declares an arg in the file is unnamed."
      - "The key that declares a secret in the file is unnamed."
      - "The CLI flag that overrides an arg is unnamed."
      - "The arg reference syntax is unchosen, and it must differ from molecule's `${VAR}`."
      - "Arg declarations enter `spec/molecule-config.schema.yml` once the spelling is chosen."

  - title: "Dispatch a tree's nodes through the pluggable executor"
    status: "raised, not started"
    raised: "2026-10-02"
    owning_doc: "`design/data/execution-environments.yml`"
    framing:
      - "The orchestrator owns ordering, the snapshot handoff, retry, and teardown, and the executor decides where each node's actions run (`design/data/lifecycle.yml`)."
      - "Undecided is what crosses the executor seam for one node, beyond its config and its snapshot."
      - "Undecided is whether one tree's nodes may run on different executor targets."
      - "A child on a different target than its parent must reach the parent's instances, so instances local to the parent's target do not qualify."
      - "Undecided is how an executor reports a cancel back to the orchestrator so teardown still runs."
      - "Undecided is how the orchestrator handles its own cancel signal so teardown runs within a CI engine's grace period."
      - "Undecided is what the orchestrator reports as left standing when that grace period runs out."

  - title: "Derive instance names for catalog selections"
    status: "waiting on run identity"
    raised: "2026-09-21"
    owning_doc: "`spec/molecule-config.schema.yml`"
    framing:
      - "Only a catalog selection gets a derived instance name, and an inline platform keeps its `name` as written."
      - "Undecided is the spelling, a name molecule derives with no author input or a templated `name:` the author writes."
      - "Undecided is whether the inventory hostname stays the catalog name while the derived name goes to the create step as the backing object's name."
      - "The derived name needs run identity, which is a residual ephemeral item below."

  - title: "The per-node run report"
    status: "raised, not started"
    raised: "2026-10-02"
    owning_doc: "`design/data/lifecycle.yml`"
    framing:
      - "GitLab renders a JUnit XML report natively, and GitHub renders one through a reporting action or the Checks API."
      - "Undecided is the report format, JUnit alone or JUnit beside a molecule-native form."
      - "Undecided is how a run switches the report on and where it writes it."
      - "Unknown is whether molecule's existing run results already carry what a per-node report needs."

  - title: "A reused resource pool of instances assigned to children"
    status: "deferred under a working assumption"
    raised: "2026-09-23"
    framing:
      - "linux-system-roles/storage allocates a fixed count of ephemeral nodes on demand (Artemis on Testing Farm, local virtual for `tmt try`) and packs 150 test playbooks onto them, reusing each node as it frees rather than booting one per test."
      - "The proposed model boots a fresh node per scenario capped by `--workers`, which matches the concurrency width but not the reuse."
      - "The question is whether a driver should be able to maintain a standing pool of instances, hand a freed instance to the next runnable child, and reuse it, so a run does far fewer boots than one per scenario."
      - "This is the one capability molecule-as-is lacks, and it trades fresh-node isolation for lower provisioning cost."
      - "A golden-image parent with copy-on-write clones may make fresh-per-scenario cheap enough that a pool is unnecessary, so the pool's value depends on how expensive the cold start really is."
      - "The motivation for the fixed node count upstream is unknown, whether a resource threshold, a max instance cap, cold-start time, or something else, which the question below covers."
      - "Working assumption for now, the fixed count is only a max concurrency cap and that count is all they can support at once, so `--workers` set to that cap is the near-term answer and no pool is built unless the count turns out to serve another purpose."

  - title: "Generalize the snapshot into a pluggable allocation scheduler"
    status: "raised, not started"
    raised: "2026-09-23"
    framing:
      - "Allocation is implicit today, each scenario's driver creates and owns its own instance and `--workers` only caps how many run at once."
      - "The question is whether the snapshot and copy-at-start mechanism should generalize into a pluggable scheduler that owns how inventory is allocated across children."
      - "Fresh-per-child, a reused pool, and copy-on-write clones of a snapshot would then be allocation strategies behind one seam rather than a single baked-in behavior."
      - "This is the general form of the resource-pool question above, which becomes one strategy under the seam."

  - title: "What the fixed managed-node count in linux-system-roles/storage is for"
    status: "raised, not started"
    raised: "2026-09-23"
    framing:
      - "linux-system-roles/storage test plans provision a fixed pool of managed nodes and pack all test playbooks onto them, but the reason for the specific count is not stated in the plan."
      - "Knowing the real driver, a resource threshold, a max instance cap, cold-start time, or something else, decides whether the pool and pluggable-scheduler questions above need answering or are moot."
      - "The design answers the requirement behind the count, not the count itself."

todo:
