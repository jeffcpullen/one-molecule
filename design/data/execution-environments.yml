# yaml-language-server: $schema=../structure/execution-environments.schema.yml
---
# execution-environments source, the runtime envelope: the runtime methods and
# what each provides, the executor seam, the ahead-of-time build seam, the two EE
# entry forms and name inference, pull-policy availability, provenance and run
# identity, the cell contract, the per-EE option bags, and selection by labels.
# State the rule, never the reasoning. The outer-engine matrix rejection lives in
# design/data/rejected-ideas.yml. spec/molecule-config.schema.yml owns the
# config keys and the label selection mechanics, this file owns the runtime design.
# One idea per rule, no semicolons, no em or en dashes.

title: "Execution environments, the runtime the sequence runs inside"
intro: >-
  The runtime is the sealed, selectable execution the whole sequence runs inside, declared once under
  the run-only `runtime:` block. This file owns the runtime methods, the executor and build seams, the
  execution-environment entry forms, provenance, and the cell contract. `spec/molecule-config.schema.yml` owns the
  config keys and the label selection mechanics, and molecule references the runtime but never builds or
  inspects its contents.
status: direction settled 2026-09-21, promoted to schema, executor and build seams and the ee entry forms settled

sections:
  - title: Runtime methods
    intro: The method is how the runtime is provided, and it is the discriminator of the runtime block.
    tables:
      - header: [Method, Isolation, Fan-out, Owner of the outer loop]
        rows:
          - ["`ee`", A container carries the controller toolchain, One cell per EE, Molecule natively]
          - ["`host`", None, None, Molecule in the ambient session]
          - ["`<custom>`", Per plugin, Per plugin, The registered runtime plugin]
    rules:
      - "`runtime:` is run-only and declares the runtime once for the whole run."
      - "`method:` is the discriminator, one of `ee`, `host`, or a registered custom name."
      - "`ee` runs the control plane inside a referenced container that carries the controller toolchain."
      - "`host` runs in the ambient session with no isolation and no fan-out, which is today's behavior."
      - "A custom method is a registered name whose plugin reads `additional_parameters`."
      - "Molecule never builds venvs, so there is no venv method, and the single-interpreter case is `host`."

  - title: The executor seam
    intro: The executor decides how the control plane runs, and it is loosely coupled.
    rules:
      - "`executor:` selects the executor and defaults to `ansible-runner`."
      - "Molecule defines what to run, and the executor decides how, whether local, remote podman, kubernetes, or AAP."
      - "The executor contract is a clean specification other executors are designed to."
      - "ansible-runner is one implementation and never a binding."
      - "ansible-runner emits a standardized JSON event stream, the substrate for tracing and display."

  - title: The build seam
    intro: Build is a separate ahead-of-time phase and never part of the run.
    rules:
      - "`build_method:` selects the build plugin and defaults to `none`."
      - "`none` builds nothing, and every referenced image must already exist."
      - "ansible-builder is one build plugin and never a binding, and further methods may be added."
      - "Molecule defines what to build and which method, and the plugin performs the build."
      - "An EE cannot be built by the run it carries, so it is always built ahead of time."
      - "At run time molecule checks an EE is available and never builds it."

  - title: Execution-environment entry forms
    intro: Each entry under `runtime.execution_environments` is one EE reference in one of two forms.
    rules:
      - "An EE reference decomposes into a `repository`, an `image`, and a `tag` or a `digest`."
      - "The compact string is a full ref, `repository/image:tag` or `repository/image@digest`."
      - "The compact form is a single cell and is the single-EE home, a one-element list."
      - "The discrete form writes `repository`, `image`, `name`, and `labels` once."
      - "The discrete form fans out one cell over each of its `tags` and `digests`."
      - "At least one of `tags` or `digests` is required in the discrete form, and both may coexist."
      - "`tags` and `digests` are two explicit lists rather than one mixed list, to keep the linter simple."
    code:
      - caption: "The compact form, one cell."
        lang: yaml
        body: |
          runtime:
            method: ee
            execution_environments:
              - quay.io/acme/ee:2.20            # -> cell ee_2.20
      - caption: "The discrete form, defined once and fanned out."
        lang: yaml
        body: |
          runtime:
            method: ee
            build_method: ansible-builder
            execution_environments:
              - repository: quay.io/acme
                image: ee
                tags:                           # -> cells ee_2.18, ee_2.19
                  - 2.18
                  - 2.19
                digests:                        # -> cell ee_abc123, pinned
                  - "sha256:...abc123"
                pull_policy: missing
                labels:
                  - nightly
                build_opts:                     # opaque, for build_method
                  definition: build/acme-ee.yml
                method_opts:                    # opaque, for the executor
                  env:
                    FOO: bar

  - title: Name inference
    intro: A cell always has a unique name without the author spelling one out.
    rules:
      - "A cell's `name` is inferred as `{image}_{tag}` or `{image}_{last-6-of-digest}` when unset."
      - "An explicit `name` on an entry replaces the `{image}` prefix of every cell it produces."

  - title: Availability and pull policy
    intro: Under the `ee` method each cell's image is a run precondition, governed per EE by `pull_policy`.
    tables:
      - header: [Value, Behavior]
        rows:
          - ["`always`", Pull every run]
          - ["`missing`", "Pull only when not present locally, the default"]
          - ["`never`", Require it present locally and fail loudly if absent]
    rules:
      - "`missing` is the default because molecule never builds at run time against a registry."
      - "`never` is the fail-loud behavior for an image expected to be present already."

  - title: Provenance and run identity
    intro: Author freely, and always record the digest.
    rules:
      - "An author references an EE by tag freely."
      - "At run time molecule resolves each tag to its digest and records the digest in run identity and the trace."
      - "The provider is part of cell identity."
      - "An EE and a `host` run at the same python and ansible-core are not identical contents."
      - "python and ansible-core are provenance observed on a `host` run and never a declared axis."

  - title: The cell contract
    intro: Whatever the method, it yields a set of cells, the fixed interface additional runtimes are designed to.
    rules:
      - "Each cell has a unique `name` that feeds run identity, the ephemeral path, selection, and the trace join."
      - "Each cell has a display coordinate or label."
      - "Each cell carries the executor inputs for its method."
      - "Per-platform coverage is scenario expansion, not a runtime axis, so the runtime fans out one cell per EE."

  - title: The option bags
    intro: One run-level plugin selector plus a per-EE opaque bag, on both the build side and the run side.
    rules:
      - "`build_opts` on an entry carries whatever the chosen `build_method` plugin needs to build that EE."
      - "`method_opts` on an entry carries whatever the runtime method or executor needs to run that EE."
      - "Both bags are per-EE, both optional, and both opaque to molecule."
      - "`additional_parameters` is run-level and carries a custom runtime's run-wide config, opaque to molecule."
      - "Molecule validates the fixed keys and never descends into an opaque bag."

  - title: Selection
    intro: EEs are one of the label selection dimensions, alongside platforms and scenarios.
    rules:
      - "`labels:` on an EE entry place it in the EE selection dimension (`spec/molecule-config.schema.yml`)."
      - "A bare run executes every EE, because a label narrows only when named."
      - "`--label` and `--skip-label` narrow the EE dimension the same way as platforms and scenarios."
