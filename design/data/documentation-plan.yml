# yaml-language-server: $schema=../structure/documentation-plan.schema.yml
---
# documentation-plan source, the Diataxis documentation map for the single
# top-level molecule.yml at spec 0.3.0. An index archetype: mapping tables
# (page to owning docs, recipe to example) plus the tutorial and example rules.
# It references owning docs, it does not restate them. Status of any design
# item lives in its owning doc, never here.
# One idea per rule, no semicolons, no em or en dashes.

title: "Documentation plan: the single top-level `molecule.yml`"
intro: >-
  Maps spec 0.3.0 and the design docs it relies on onto a Diataxis structure. A subject the spec
  does not declare has no page. It references the owning docs, it does not restate them.
status: planning output, not design, references owning docs and does not restate them

sections:
  - title: Explanation
    intro: The why, concept and rationale pages.
    tables:
      - header:
          - Page
          - Owning docs
        rows:
          - - "The pattern (the root file, the shared playbooks folder, why the project root)"
            - "`design/data/layout.yml`"
          - - "The missing scope (the problem)"
            - "`design/data/naming.yml`, `design/data/layout.yml`"
          - - "Every scenario in one file"
            - "`spec/molecule-config.schema.yml`, `design/data/layout.yml`"
          - - "Nothing written today is lost"
            - "`spec/molecule-config.schema.yml`, `design/data/tree-spec.yml` (activation)"
          - - "A parent for a dependency, `defaults:` for shared config"
            - "`design/data/defaults.yml`"
          - - "What happens to `shared_state`"
            - "`design/data/tree-spec.yml` (activation, the tree today's molecule runs), `design/data/rejected-ideas.yml`"

  - title: Reference
    intro: The what, the spec pages.
    tables:
      - header:
          - Page
          - Owning docs
        rows:
          - - "The root file and its top-level keys (`workers`, `platforms`, `defaults`, `scenarios`)"
            - "`spec/molecule-config.schema.yml`"
          - - "Scenario keys (`name`, config keys, `playbooks`, `wave`, `children`)"
            - "`spec/molecule-config.schema.yml`"
          - - "The platform catalog, selection, and catalog `host_vars`"
            - "`spec/molecule-config.schema.yml`, `design/data/tree-spec.yml` (the handoff to molecule)"
          - - "Scope and precedence (`defaults:` vs bare)"
            - "`spec/molecule-config.schema.yml`"
          - - "Paths (a relative `playbooks` path resolves against the project root)"
            - "`spec/molecule-config.schema.yml`"
          - - "The tree (roots, the parent edge, sharing a parent's instances)"
            - "`spec/molecule-config.schema.yml`, `design/data/tree-spec.yml` (the edge, activation)"
          - - "The tree today's molecule runs"
            - "`design/data/tree-spec.yml` (the tree today's molecule runs)"
          - - "What the converter writes for today's molecule"
            - "`tools/converter/README.md`"
          - - "Glossary"
            - "`design/data/naming.yml`"

  - title: How-to
    intro: Task recipes, the migrations. Each points at a synthetic example where one exists.
    tables:
      - header:
          - Recipe
          - Worked example
        rows:
          - - "Convert a project of independent scenarios"
            - "`examples/collection`, `examples/roles`, `examples/playbooks`"
          - - "Convert a `shared_state` project to a tree"
            - "`examples/collection-shared-state`"
          - - "Define a repeated platform once"
            - ""
          - - "Share one converge or verify playbook"
            - "`examples/roles`"
          - - "Add a child to a `shared_state` tree"
            - "`examples/collection-shared-state`"
          - - "Run scenarios in parallel (`workers`)"
            - ""
          - - "Check the conversion with the converter"
            - ""

  - title: Tutorial
    intro: Learning, start to finish, greenfield.
    tables:
      - header:
          - Tutorial
          - What it teaches
        rows:
          - - "Getting started with a playbook project"
            - "one scenario, then two independent scenarios, then a platform defined once, then a `default` root with children"

  - title: Examples
    intro: Worked examples that support every quadrant.
    rules:
      - "The synthetic examples come first: `playbooks`, `roles`, `collection` and `collection-shared-state`, each a single-file project at `examples/<name>/molecule.yml`."
      - "Each upstream example carries its original layout in `before/` and the converted root file in `after/`, licensed and traceable."

  - title: What changes for an existing project
    intro: An existing project keeps running unchanged, and each fact below is owned by a design doc.
    rules:
      - "The first change adds structure and changes no behavior (noun before verb)."
      - "Existing directory layouts keep running unchanged, and the root file is a second discovery mode, not a replacement, per `design/data/layout.yml`."
      - "No existing behavior changes, because a directory-mode project keeps molecule's behavior, `shared_state` included, per `design/data/tree-spec.yml`."
