# yaml-language-server: $schema=../structure/naming.schema.yml
---
title: Terms
intro: >-
  Every term of art this design uses, and the one sense each carries.
status: "The vocabulary is settled and used across the design set."
usage:
  - "Each term is used in exactly one sense across the design set, the tool output, and any proposal."
  - "A never line is given only where a term collides with a near neighbor."
  - "Config keys keep their trailing colon, CLI flags their dashes, and env vars their exact case."
groups:
  - title: Scope and core vocabulary
    intro: The scopes, the tree parts, and the discriminators the whole design rests on.
    terms:
      - term: "Scenario"
        means: "One environment, one converge, one verify, one state. The base unit."
        never: "Anything structural."
      - term: "Scenario tree"
        means: "A root scenario and everything declared onto it. The unit of ordering, gating, and lifetime."
        never: "The whole run."
      - term: "Tree"
        means: "Short for scenario tree, and the replacement for the retired group. Trees are independent by construction."
      - term: "Run"
        means: "One invocation over one or more trees. The unit a run id, an artifact name, and a repo-wide action belong to."
        never: "A single tree."
      - term: "Node"
        means: "A scenario considered as a member of a tree. The replacement for the retired role."
        never: "A stage or a lifecycle step."
      - term: "Root"
        means: "A node with no parent, an entry directly under `scenarios:`."
        never: "`default` specifically."
      - term: "Parent / child"
        means: "The declared edge between two nodes, a dependency and not a reference."
        never: "Configuration inheritance."
      - term: "Edge (parent edge)"
        means: "The tree's one structural relationship, declared by nesting under `children:` in the single file."
      - term: "Level"
        means: "A depth stratum used only by the scheduler."
        never: "A node."
      - term: "Depth"
        means: "Tree nesting distance, unbounded and guarded only by the cycle check."
      - term: "Snapshot"
        means: "What a child starts from, a copy of the parent's inventory directory owned by the child."
        never: "A live read of the parent."
      - term: "Copy-at-start"
        means: "The child copies the parent's inventory into its own ephemeral dir once at node start, then reads only its own files."
      - term: "Standing"
        means: "A node whose environment is up and converged so it needs no work."
        never: "Merely created."
      - term: "Left standing"
        means: "Nodes a run built and did not tear down."
      - term: "Owner"
        means: "The node whose create produced an object. Ownership never passes to another node."
        never: "The node that tests against those instances."
      - term: "Ownership (derived)"
        means: "Ownership derived from a node having a defined create, never declared by a key."
      - term: "Defaults"
        means: "Configuration inheritance via the `defaults:` block (this node and below) plus a base config.yml. The only mechanism called inheritance."
        never: "A dependency."
      - term: "Defaults cascade"
        means: "Resolution where a defaults key on a node applies to it and every descendant, producing a node's resolved create."
      - term: "Gate"
        means: "The guarantee that a child runs only against a parent that passed its own verify. Verify is the readiness gate."

  - title: Lifecycle, phases, and traversal
    intro: The per-node actions and the rules that order, gate, and unwind them.
    terms:
      - term: "Action"
        means: "A per-node step (dependency, syntax, prepare, converge, idempotence, side_effect, verify, cleanup, create, destroy)."
      - term: "create"
        means: "The author's instance-creation playbook. A defined create makes a node a creator, the owner of what it produces. Molecule ships no default."
      - term: "destroy"
        means: "The author's teardown playbook. Runs only at the owning node. No default is shipped."
      - term: "cleanup"
        means: "Undoes a node's own layer. Leading cleanup clears a prior layer on re-run, trailing undoes it at teardown."
      - term: "converge"
        means: "The per-node action that applies the content under test to the node's instances."
      - term: "prepare"
        means: "The per-node action that readies instances before converge."
      - term: "verify"
        means: "The per-node action that asserts the converged state, and the readiness gate for children."
      - term: "syntax"
        means: "The per-node action that syntax-checks the playbooks."
      - term: "idempotence"
        means: "The per-node action that reruns converge and asserts no change."
      - term: "side_effect"
        means: "The per-node action for out-of-band changes between converge and verify."
      - term: "dependency"
        means: "The per-node action that pulls in required roles and collections."
        never: "The parent edge, which is a different sense of dependency."
      - term: "test_sequence"
        means: "The default per-node action sequence."
      - term: "Layer"
        means: "The environment state a node's actions stand up, which its children depend on."
      - term: "Gated out"
        means: "A descendant not run because an ancestor failed, distinct from user-filtered. The skip reason names the gating phase."
      - term: "Verify contract"
        means: "A node's verify must be side-effect-free and repeatable, and must not mutate inventory."
      - term: "Readiness gate"
        means: "Verify as the check that a layer is ready for children."
      - term: "Ancestor resolution / ancestor closure"
        means: "A run of any node resolves its full ancestor chain transitively, upward only, whether or not those ancestors were selected."
      - term: "Ancestor chain"
        means: "A node's ordered path to its root, root first."
      - term: "Implicit node"
        means: "A node pulled in as a dependency though outside the selection. Already `implicit` in code, and left standing at run end."
      - term: "Missing-parent policy"
        means: "Whether a missing ancestor is built or refused (`missing_parent:` create or fail, default create, `--missing-parent` overrides)."
      - term: "Instance generation"
        means: "The rule invalidating a non-owner's stale flags when the owner rebuilds. The owner stamps a new generation when create succeeds. A tree node's replacement for `force: True`."
      - term: "Traversal"
        means: "Setup pre-order (root first) and teardown post-order (deepest first), iterative and not recursive."
      - term: "Pre-order / post-order"
        means: "Setup order and teardown order respectively."
      - term: "Teardown"
        means: "Post-order removal of layers and instances, with destroy at each owning node governed by `--destroy`."
      - term: "Retry"
        means: "Cleaning a node's subtree post-order then re-running the node while leaving ancestors standing (`molecule test -s <node>`)."
      - term: "Destroy policy"
        means: "`--destroy` with always (default), on-success, or never, mapped from the MOLECULE_DESTROY env var."
      - term: "Skipped (vs failed)"
        means: "Descendants under a gate failure are marked skipped with a reason, not failed."

  - title: Trees, scheduling, and concurrency
    intro: How trees fail, how siblings coexist, and how work fans out across workers.
    terms:
      - term: "Fail-fast (per tree)"
        means: "A tree's failure drops that tree's pending descendants and continues, and does not stop other trees."
      - term: "Sibling independence contract"
        means: "Siblings in one wave run concurrently so must be independent. The user's contract."
      - term: "Wave"
        means: "An ordering tier among siblings, roots included, with no dependency between them. Lower waves complete their subtrees before higher waves start."
      - term: "Sibling collision"
        means: "Two concurrent siblings whose inventories name the same host, a nondeterministic worker-count-dependent failure."
      - term: "Continue-on-failure"
        means: "`--continue-on-failure`, do not skip siblings on a failure."
      - term: "Worker / worker process"
        means: "A concurrency slot running one whole scenario, capped by `--workers`."
      - term: "Run fan-out / runtime fan-out"
        means: "One tree run N times over the runtime's execution environments. Why the run has to become the unit."
      - term: "Level-wise vs submit-when-ready"
        means: "Level-wise waits for a whole depth level before starting the next, submit-when-ready submits each node as soon as it is runnable. Level-wise is retired."

  - title: Paths, anchors, and state
    intro: The named path bases, the ephemeral working area, and where per-node state lives.
    terms:
      - term: "Anchors"
        means: "The named path bases (content root, collection root, scenario directory, project root) that relative paths resolve against."
      - term: "Content root"
        means: "The always-exists anchor, the thing under test that owns the scenarios directory. Resolves in every layout."
      - term: "Collection root"
        means: "The anchor for collection-only things, the nearest ancestor holding galaxy.yml. Exported conditionally as MOLECULE_COLLECTION_DIRECTORY."
      - term: "Scenario directory"
        means: "This node's own source, the dir holding its molecule.yml. The default anchor."
      - term: "Project root"
        means: "The workspace, which may hold several content roots. MOLECULE_PROJECT_DIRECTORY."
        never: "The content root, since one project can hold many content roots."
      - term: "Discovery walk / upward discovery"
        means: "Walking up to find the content root, stopping at the enclosing VCS root."
      - term: "Content marker"
        means: "A galaxy.yml or a scenarios directory used to anchor discovery."
      - term: "Ephemeral directory"
        means: "The per-run working area holding three content categories, mirroring the tree under a run."
      - term: "Durable node facts / Materialized inputs / Playbook scratch"
        means: "The three ephemeral content categories (only durable facts are real state)."
      - term: "Project segment"
        means: "A path segment checksummed over the project's resolved absolute path, disambiguating projects that share a cache."
      - term: "Location root"
        means: "The first path dimension of the composed ephemeral path."
      - term: "Run identity / run id"
        means: "The path and identity segment keeping concurrent runs disjoint (today's --parallel run_uuid). Internal, not exported to playbooks."
      - term: "Tree position"
        means: "The tree-mirrored portion of the composed ephemeral path."
      - term: "Live inventory / merged inventory"
        means: "The inventory directory that is the snapshot channel, deep-merged with child-wins."
      - term: "`instance_config.yml`"
        means: "The creator's ownership record of the instances it made. Per node, not snapshotted down."
      - term: "`state.yml` / state file"
        means: "A node's own per-node state (created, driver, prepared, converged), read and written by that node alone."
      - term: "Per-node state"
        means: "State is strictly per node. There is no shared state file at all."
      - term: "Flags / lifecycle flags"
        means: "created, prepared, and converged. Reset only by destroy, invalidated across generations."
      - term: "Node group"
        means: "Molecule places each node's instances in one group named for the node."

  - title: Runtime and execution environments
    intro: The sealed runtime, the cell it yields, and the pluggable seams under it.
    terms:
      - term: "Runtime envelope"
        means: "The sealed execution declared under the run-only `runtime:` block."
      - term: "Execution environment (EE)"
        means: "A container that carries the controller toolchain, a run precondition under the ee method."
      - term: "Cell"
        means: "The fixed unit a runtime method yields (one per EE, tag, or digest). Feeds run identity, ephemeral path, selection, and trace."
      - term: "Cell contract"
        means: "The fixed cell interface that additional runtimes are designed to."
      - term: "Compact form / discrete form"
        means: "The two EE reference entry forms (a full-ref string, or an object that fans out over tags and digests)."
      - term: "Name inference"
        means: "A cell's name inferred as image_tag, or image plus the last 6 of the digest."
      - term: "Platform catalog"
        means: "The run-level `platforms:` defining each platform once by name, which scenarios select by name."
      - term: "Platform selection"
        means: "A scenario's selection of catalog names (or inline objects)."
      - term: "Selection / label selection"
        means: "Narrowing which scenarios, platforms, or EEs run via labels and `--label` and `--skip-label`. It narrows, never depends."
      - term: "Selection dimension"
        means: "An axis (scenarios, platforms, or EEs) that a label filters."
      - term: "Provenance (of an EE/run)"
        means: "Where an EE's or run's contents come from (digest, provider, python, ansible-core), recorded in run identity and trace."
      - term: "Executor"
        means: "The pluggable backend deciding how the control plane runs. Defaults to ansible-runner, swappable behind a fixed contract."
      - term: "Build method / build plugin"
        means: "The pluggable ahead-of-time build (default none, ansible-builder is one plugin)."
      - term: "Runtime method / runtime plugin"
        means: "How the runtime is provided (ee, host, or a registered custom plugin)."
      - term: "Control plane"
        means: "What the executor runs (converge, verify, side_effect)."
      - term: "Artifact / artifact node"
        means: "Something a node's create brings into existence that is not an instance (an image, a VM template, an EE). Machine-global."
      - term: "Provisioning gap"
        means: "The absence of a home for a step that precedes create and outlives it."

  - title: Components and roles
    intro: The named components of the internal architecture, each by the role it plays.
    terms:
      - term: "Orchestrator"
        means: "The layer above a single scenario, which hands each node to molecule. The only reader of other nodes' state."
        never: "A node."
      - term: "Provisioner"
        means: "Reports inventory hosts and groups, and is molecule's provisioner.playbooks seam."
      - term: "Tree-builder"
        means: "Computes a node's ancestors and catches cycles at tree build."
      - term: "State-store"
        means: "Computes a node's standing and generation."
      - term: "Defaults-cascade (component)"
        means: "Computes a node's resolved create."
      - term: "Scheduler / submit-when-ready scheduler"
        means: "Submits what is ready and refills on completion. Drives `--workers`, with a node as its unit within a run context."
      - term: "Linter / static-analysis provider"
        means: "The counterpart running the content-set lint. Molecule holds no linter knowledge."

  - title: Config keys
    intro: The authored keys, spelled with their trailing colon.
    terms:
      - term: "`children:`"
        means: "Single-file nesting that is the edge."
      - term: "`scenarios:`"
        means: "The list of root nodes, run in wave order and in list order within a wave."
      - term: "`defaults:` (block)"
        means: "A sparse config overlay meaning this node and below. The run-level `defaults:` is the virtual root."
      - term: "Bare key"
        means: "A config key placed directly on a node, applying to this node only and never cascading."
      - term: "`shared:`"
        means: "A parent-only boolean (default true). false stops sharing inventory down to children. It never gates creation."
      - term: "`shared_state`"
        means: "Molecule's own key, unchanged in a directory-mode project and not a key in the single file."
      - term: "`playbooks:`"
        means: "A top-level alias for provisioner.playbooks mapping actions to paths."
      - term: "`runtime:`"
        means: "The run-only block naming the sealed execution."
      - term: "`method:`"
        means: "The runtime discriminator (ee, host, or custom)."
      - term: "`executor:`"
        means: "The pluggable-selector key choosing the executor backend."
      - term: "`build_method:`"
        means: "The pluggable-selector key choosing the build plugin."
      - term: "`execution_environments:`"
        means: "The ee method's axis, one cell per entry."
      - term: "`pull_policy:`"
        means: "Per-EE image availability (always, missing, or never)."
      - term: "`build_opts` / `method_opts` / `additional_parameters`"
        means: "Opaque per-EE and run-level option bags."
      - term: "`labels:`"
        means: "Selection membership on a platform, a scenario, or an EE."
      - term: "`platforms:`"
        means: "The run-only catalog and the per-scenario selection."
      - term: "`missing_parent:`"
        means: "The behavior key, create or fail."
      - term: "`wave:`"
        means: "A node's integer ordering tier among its siblings, roots included (default 0)."

  - title: Command-line flags and subcommands
    intro: The flags that stay on the command line, and the subcommands over the tree.
    terms:
      - term: "`--workers`"
        means: "The experimental global concurrency cap (an integer, cpus, or cpus-1), one whole scenario per slot."
      - term: "`--destroy` (and `MOLECULE_DESTROY`)"
        means: "The destroy-policy flag and its env-var mapping."
      - term: "`-s` / `--exclude`"
        means: "Selection knobs that stay on the command line."
      - term: "`--missing-parent`"
        means: "The override for the missing-parent policy."
      - term: "`--label`"
        means: "Selects nodes by label membership."
      - term: "`--skip-label`"
        means: "Excludes nodes by label membership."
      - term: "`--continue-on-failure`"
        means: "Runs siblings even after one fails."
      - term: "`molecule matrix`"
        means: "Prints the tree."
      - term: "`molecule list`"
        means: "Reports occupancy."
      - term: "`molecule reset`"
        means: "Clears directories."
      - term: "`molecule test -s <node>`"
        means: "Defines a subtree traversal from the named node."

  - title: Environment variables
    intro: The env vars that map onto config and the anchors.
    terms:
      - term: "`ENV_VAR_CONFIG_MAPPING`"
        means: "The home mapping env vars onto config, which gains entries."
      - term: "`MOLECULE_GLOB`"
        means: "The escape hatch pinning the content root to cwd and skipping discovery."
      - term: "`MOLECULE_PROJECT_DIRECTORY`"
        means: "The project-root anchor export."
      - term: "`MOLECULE_COLLECTION_DIRECTORY`"
        means: "The collection-root anchor export."
      - term: "`MOLECULE_CONTENT_ROOT`"
        means: "The content-root anchor export."
      - term: "`MOLECULE_EPHEMERAL_DIRECTORY`"
        means: "The ephemeral-location override (its input meaning deprecated and split)."

  - title: Retired and reserved terms
    intro: Words the design no longer uses, each with the replacement to reach for.
    terms:
      - term: "group"
        means: "Retired. Collides with Ansible inventory groups and group_vars. Use tree."
      - term: "role"
        means: "Retired as a design word. Collides with Ansible roles. Use node."
      - term: "inherited / inherit"
        means: "Reserved for configuration only. The runtime handoff is a snapshot, not inherited."
      - term: "layered scenarios"
        means: "Not a term of art. The feature is scenario trees, and Layer keeps its lifecycle sense above."
      - term: "handover"
        means: "Weighed and not adopted as a name for snapshot."
      - term: "owns_instances"
        means: "Removed boolean. Ownership is now derived."
      - term: "`force: True`"
        means: "Molecule's own, kept for directory mode. A tree node uses the instance generation instead."
      - term: "`execute_subcommand_default`"
        means: "Molecule's own, kept for directory mode and never reached by a tree node."
      - term: "default"
        means: "A node of the tree like any other, its old jobs dissolved."
        never: "A synonym for root."
      - term: "Scenario orchestration"
        means: "The umbrella name for the whole body of work, distinct from the specific Scenario trees proposal."
