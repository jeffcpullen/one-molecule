---
$schema: https://json-schema.org/draft/2020-12/schema
title: Open-questions source
description: 'Bespoke shape for design/data/open-questions.yml: the register of undecided items and a TODO backlog. A decided item moves to its owning source and is deleted, so there is no resolved list. An item discussed in public names its issue numbers, and the decision still lands in the owning source. Each open item keeps bounded framing lines only, and states what is unknown or undecided about the design rather than an action for anyone to take. Every text string forbids the semicolon and the em or en dash (house writing style).'
type: object
additionalProperties: false
required:
  - title
  - intro
  - open
  - todo
properties:
  title:
    $ref: '#/$defs/line'
  intro:
    $ref: '#/$defs/line'
  open:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/question'
  todo:
    type: object
    additionalProperties: false
    required:
      - residual_ephemeral
      - documentation_backlog
    properties:
      residual_ephemeral:
        $ref: '#/$defs/linelist'
      documentation_backlog:
        $ref: '#/$defs/gistlist'
$defs:
  line:
    type: string
    minLength: 1
    not:
      pattern: '[;—–]'
    description: A non-empty text string with no semicolon and no em or en dash.
  question:
    type: object
    additionalProperties: false
    required:
      - title
      - status
      - framing
    properties:
      title:
        $ref: '#/$defs/line'
      status:
        allOf:
          - $ref: '#/$defs/line'
        description: The disposition, rendered in the heading parenthetical (e.g. "not started").
      raised:
        allOf:
          - $ref: '#/$defs/line'
        description: Optional date the item was raised, rendered before the status.
      framing:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/line'
        description: Bounded framing points, one idea each.
      owning_doc:
        allOf:
          - $ref: '#/$defs/line'
        description: Optional source that owns the decision, where the settled part already lives.
      issues:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: integer
          minimum: 1
        description: Optional numbers of the public issues in this repository that carry the discussion. An item with none stays internal.
  linelist:
    type: object
    additionalProperties: false
    required:
      - items
    properties:
      intro:
        $ref: '#/$defs/line'
      items:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/line'
  gistlist:
    type: object
    additionalProperties: false
    required:
      - items
    properties:
      intro:
        $ref: '#/$defs/line'
      items:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required:
            - gist
            - detail
          properties:
            gist:
              $ref: '#/$defs/line'
            detail:
              $ref: '#/$defs/line'
