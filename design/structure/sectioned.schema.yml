---
$schema: https://json-schema.org/draft/2020-12/schema
title: Design spec source (sectioned rules and tables)
description: 'The shared shape for a machine-readable design-spec source: a titled document of sections, each carrying a list of atomic rules and/or decision tables. Reused across every spec-archetype source (tree-spec, lifecycle, ...). A source''s sibling <doc>.schema.yml is a thin $ref to this file, which keeps the CI convention (a source X.yml is validated by X.schema.yml) pure while one shape governs them all. This schema fixes the STRUCTURE and forbids the semicolon and the em or en dash (a house writing-style rule, so split the clauses or use a comma or a period). One norm it cannot express, enforced in review instead: one idea per rule, so do not stack independent assertions into a single rule unless the coupling is genuine. Rules state behavior only, with no prose essays, no decisions (design/data/rejected-ideas.yml), no implementation reasoning.'
type: object
additionalProperties: false
required:
  - title
  - intro
  - status
  - sections
properties:
  title:
    $ref: '#/$defs/line'
  intro:
    allOf:
      - $ref: '#/$defs/line'
    description: One paragraph naming what this file owns and what it defers to a sibling. Not a section.
  status:
    $ref: '#/$defs/line'
  sections:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/section'
$defs:
  line:
    type: string
    minLength: 1
    not:
      pattern: '[;—–]'
    description: A non-empty text string with no semicolon and no em or en dash. Both are house writing-style violations. Split into two rules, or use a comma, a period, or parentheses.
  cell:
    type: string
    not:
      pattern: '[;—–]'
    description: A table cell, no semicolon and no em or en dash, may be empty.
  section:
    type: object
    additionalProperties: false
    required:
      - title
    anyOf:
      - required:
          - rules
      - required:
          - tables
      - required:
          - code
    properties:
      title:
        $ref: '#/$defs/line'
      description:
        allOf:
          - $ref: '#/$defs/line'
        description: One to three sentences naming what this object is and why it exists, high-level enough to survive edits to the rules around it. A section may carry a one-line `intro` instead, and `description` is the one to read when both are present.
      intro:
        allOf:
          - $ref: '#/$defs/line'
        description: Legacy one-line framing, superseded by `description`. Retained only until every section is migrated.
      rules:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/rule'
      tables:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/table'
      code:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/codeblock'
        description: Literal code examples (a directory tree, a YAML snippet, a shell command). Each renders as an optional caption line followed by a fenced block. Code is exempt from the no-dash/no-semicolon rule.
  rule:
    oneOf:
      - allOf:
          - $ref: '#/$defs/line'
        description: 'Legacy bare-string rule, pending migration to the {name, description, check} object form. One normative statement, one idea, no semicolon. A rule that unquotes a `key: value` colon will not reach this schema as a string -- quote such rules in the YAML.'
      - $ref: '#/$defs/ruleobj'
  ruleobj:
    type: object
    additionalProperties: false
    required:
      - name
      - description
      - check
    description: 'One normative rule as an addressable object: a stable name, the firmed-up statement, and the context that can verify it. The name is the linter''s rule id. A rule carries no predicate: CUE was evaluated as the logic language and rejected, and no replacement is justified yet (see rejected-ideas and design/AUTHORING.md).'
    properties:
      name:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        description: Stable kebab-case id, unique within the document. Becomes the linter's rule id, so rename deliberately.
      description:
        allOf:
          - $ref: '#/$defs/line'
        description: The normative statement, one idea, no semicolon. This is what renders as the rule's prose.
      check:
        enum:
          - static
          - resolved
          - runtime
          - none
        description: 'Where the rule can be mechanically verified, which routes it to an enforcer. static: on molecule.yml as written, the config linter''s territory. resolved: after the defaults cascade and tree are built, still pre-run. runtime: only during or after a run, against state and the live inventory, as an orchestrator invariant. none: a behavior or definition with no mechanical check.'
  table:
    type: object
    additionalProperties: false
    required:
      - header
      - rows
    properties:
      header:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/line'
      rows:
        type: array
        minItems: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/$defs/cell'
  codeblock:
    type: object
    additionalProperties: false
    required:
      - body
    properties:
      lang:
        type: string
        description: Fence info string (e.g. yaml, text, console). Optional; omitted means a bare fence.
      caption:
        allOf:
          - $ref: '#/$defs/line'
        description: Optional one-line prose caption rendered above the fence. Prose, so no semicolon and no em or en dash.
      body:
        type: string
        minLength: 1
        description: The literal code, emitted verbatim inside a fenced block. Exempt from the no-dash/no-semicolon rule because lint_prose skips fenced blocks, so it may contain colons, dashes, pipes, and semicolons.
