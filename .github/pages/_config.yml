---
# Jekyll config for the GitHub Pages site. The pages workflow copies this file
# next to the design/docs/ pages in a build directory and builds from there.
# Plugins come from the GitHub Pages defaults, so none are listed here.

title: one-molecule
description: >-
  Documentation for one-molecule, one layout for scenario testing.
theme: minima
markdown: kramdown

# Each page opens with its own heading, so the layout prints no title above it.
defaults:
  - scope:
      path: ''
    values:
      layout: doc

# The header nav, in Diataxis order. The landing page is the site title link.
header_pages:
  - the-pattern.md
  - getting-started.md
  - migrating.md
  - reference.md
  - explanation.md
