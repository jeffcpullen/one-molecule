---
name: secrets

# The blocking secret gate. gitleaks scans the FULL history, not the checkout,
# so a credential that was committed and later deleted still fails the build.
# In a public repo a deleted file stays readable in every clone.
#
# There is no paths filter. A secret can land in any file type, so narrowing
# the trigger would be narrowing the gate.
#
# The binary is downloaded and checksum-verified rather than run through
# gitleaks/gitleaks-action, which requires a licence key for repositories owned
# by an organization. The binary has no such condition, so this job keeps
# working unchanged if ownership ever moves.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit, not just the tip. A shallow clone would scan nothing
          # older than the push and the gate would silently stop covering the
          # history it exists to cover.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gitleaks.tar.gz "${base}/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # --redact keeps a real finding out of a public build log. The rule, the
      # commit and the file are still reported, which is what you need to act.
      - name: Scan the full history for secrets
        run: gitleaks git --no-banner --redact --verbose --config .gitleaks.toml .
